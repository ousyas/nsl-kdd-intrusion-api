name: CI and container delivery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

  docker:
    name: Build and start Docker image
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Check training data
        run: test -s 'data/KDDTrain+.txt' && test -s 'data/KDDTest+.txt'

      - name: Build image and train model
        run: docker build --tag kdd-api:ci .

      - name: Start container and check API readiness
        run: |
          docker run -d --name kdd-api-ci -p 8000:8000 kdd-api:ci
          for attempt in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 5
          done
          docker logs kdd-api-ci
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          docker tag kdd-api:ci "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag kdd-api:ci "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Stop container
        if: always()
        run: docker rm -f kdd-api-ci || true
